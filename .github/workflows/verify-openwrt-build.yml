name: Verify OpenWrt Build

# 仅用于验证能否正常编译，不发布 Release，不改动版本号。
# 产物以 artifact 形式保留 14 天。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'SDK target'
        required: true
        default: 'armsr-armv8'
        type: choice
        options:
          - armsr-armv8
          - armsr-armv7
          - x86-64
      architecture:
        description: '包架构标识（仅用于产物命名）'
        required: true
        default: 'aarch64_generic'
      sdk_version:
        description: 'SDK 版本'
        required: true
        default: '25.12.6'
        type: choice
        options:
          - 25.12.6
          - 25.12.5
          - 25.12-SNAPSHOT
          - 24.10.8
      curl_profile:
        description: 'libcurl 编译配置（minimal=精简，firmware=固件同款全功能）'
        required: true
        default: 'minimal'
        type: choice
        options:
          - minimal
          - firmware

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.event.inputs.target }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: openwrt/sdk:${{ github.event.inputs.target }}-${{ github.event.inputs.sdk_version }}
      options: --user root

    steps:
      - uses: actions/checkout@v7

      - name: 环境信息
        run: |
          echo "=========================================="
          echo "SDK:        ${{ github.event.inputs.target }}-${{ github.event.inputs.sdk_version }}"
          echo "架构标识:   ${{ github.event.inputs.architecture }}"
          echo "=========================================="
          echo "--- 编译器 ---"
          ls /builder/staging_dir/ 2>/dev/null || true
          which cc gcc 2>/dev/null || true
          echo "--- SDK 版本 ---"
          cat /builder/version 2>/dev/null || echo "(无 version 文件)"
          grep -E "^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)" /builder/.config 2>/dev/null || true

      - name: 初始化 SDK
        run: |
          set -e
          cd /builder
          [ -f .config ] || make defconfig
          echo "--- 目标平台 ---"
          grep -E "CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)" .config | head -5 || true

      - name: 安装 curl 并应用编译配置
        id: curlcfg
        run: |
          set -e
          cd /builder
          scripts/feeds update packages
          scripts/feeds install curl

          if [ "${{ github.event.inputs.curl_profile }}" = "firmware" ]; then
            echo "=== 使用固件同款配置（HTTP2 + OpenSSL + ZLIB 全开）==="
            # 复刻 OpenWrt-R4S 固件 .config 里的 libcurl 选项
            # 用循环 printf 逐行写入，避免 heredoc 缩进污染 .config
            for opt in \
              CONFIG_PACKAGE_libcurl=y \
              CONFIG_LIBCURL_HTTP=y \
              CONFIG_LIBCURL_HTTP2=y \
              CONFIG_LIBCURL_OPENSSL=y \
              CONFIG_LIBCURL_ZLIB=y \
              CONFIG_LIBCURL_COOKIES=y \
              CONFIG_LIBCURL_CRYPTO_AUTH=y \
              CONFIG_LIBCURL_FILE=y \
              CONFIG_LIBCURL_FTP=y \
              CONFIG_LIBCURL_HTTP_AUTH=y \
              CONFIG_LIBCURL_PROXY=y \
              CONFIG_LIBCURL_TFTP=y \
              CONFIG_LIBCURL_THREADED_RESOLVER=y \
              CONFIG_LIBCURL_TLS_SRP=y \
              CONFIG_LIBCURL_UNIX_SOCKETS=y
            do
              printf '%s\n' "$opt" >> .config
            done
          else
            echo "=== 使用精简配置（关闭 HTTP2/SSL/ZLIB）==="
            cat "$GITHUB_WORKSPACE/ci/openwrt/all.config" >> .config
          fi

          make defconfig
          echo "--- libcurl 生效配置 ---"
          grep -E "^CONFIG_LIBCURL_|^# CONFIG_LIBCURL_" .config | grep -v "^CONFIG_LIBCURL_\(COOKIES\|FILE\|FTP\|HTTP_AUTH\|PROXY\)" | head -25 || true
          echo "--- 依赖检查 ---"
          grep -E "^CONFIG_PACKAGE_(libnghttp2|libopenssl|zlib|libcurl)" .config || true

      - name: 预编译依赖库
        if: github.event.inputs.curl_profile == 'firmware'
        run: |
          cd /builder

          echo "========== SDK 结构诊断 =========="
          echo "--- /builder 顶层 ---"
          ls -d */ 2>/dev/null | head -20
          echo "--- package/ 目录 ---"
          ls package/ 2>/dev/null | head -20
          echo "--- package/libs/ 是否存在 ---"
          if [ -d package/libs ]; then
            echo "  ✅ 存在，内容："
            ls package/libs/ 2>/dev/null | head -30
          else
            echo "  ❌ package/libs 不存在"
          fi
          echo "--- feeds/ 目录 ---"
          ls feeds/ 2>/dev/null
          echo "--- feeds.conf ---"
          cat feeds.conf 2>/dev/null || echo "  (无)"
          echo ""

          echo "========== 查找 openssl / zlib 源码 =========="
          for name in openssl zlib; do
            echo "--- $name ---"
            found=$(find . -maxdepth 5 -type d -name "$name" -path "*libs*" 2>/dev/null | head -3)
            if [ -n "$found" ]; then
              echo "$found" | while read -r d; do echo "  找到: $d"; done
            else
              echo "  ❌ 未找到"
            fi
          done
          echo ""

          echo "========== 编译依赖 =========="
          # 只编译实际存在的目标，避免 make 对不存在的目标静默成功
          compile_if_exists() {
            local target="$1"
            local dir="$2"
            if [ -d "$dir" ]; then
              echo "=== 编译 $target ==="
              if make "$target" -j$(nproc) V=s 2>&1 | tail -20; then
                echo "  ✅ $target 完成"
              else
                echo "  ⚠️ $target 失败"
              fi
            else
              echo "  ⏭ $target 跳过（$dir 不存在）"
            fi
          }

          compile_if_exists "package/libs/openssl/compile" "package/libs/openssl"
          compile_if_exists "package/libs/zlib/compile" "package/libs/zlib"
          compile_if_exists "package/feeds/packages/nghttp2/compile" "feeds/packages/libs/nghttp2"

          echo ""
          echo "========== 开发文件检查 =========="
          for item in \
            "staging_dir/target-*/usr/include/openssl/opensslv.h|OpenSSL 头文件" \
            "staging_dir/target-*/usr/lib/libssl.so|libssl.so" \
            "staging_dir/target-*/usr/lib/libcrypto.so|libcrypto.so" \
            "staging_dir/target-*/usr/include/nghttp2/nghttp2.h|nghttp2 头文件" \
            "staging_dir/target-*/usr/lib/libnghttp2.so|libnghttp2.so" \
            "staging_dir/target-*/usr/lib/libz.so|libz.so" \
            "staging_dir/target-*/usr/lib/pkgconfig/libcurl.pc|libcurl.pc"
          do
            pattern="${item%%|*}"
            label="${item##*|}"
            if ls $pattern >/dev/null 2>&1; then
              echo "  ✅ $label"
            else
              echo "  ❌ $label"
            fi
          done

          echo ""
          echo "========== 结果写入 summary =========="
          {
            echo "### firmware 模式依赖诊断"
            echo ""
            echo "| 文件 | 状态 |"
            echo "|---|---|"
            for item in \
              "staging_dir/target-*/usr/include/openssl/opensslv.h|OpenSSL 头文件" \
              "staging_dir/target-*/usr/lib/libssl.so|libssl.so" \
              "staging_dir/target-*/usr/lib/libcrypto.so|libcrypto.so" \
              "staging_dir/target-*/usr/include/nghttp2/nghttp2.h|nghttp2 头文件" \
              "staging_dir/target-*/usr/lib/libnghttp2.so|libnghttp2.so" \
              "staging_dir/target-*/usr/lib/libz.so|libz.so"
            do
              pattern="${item%%|*}"
              label="${item##*|}"
              if ls $pattern >/dev/null 2>&1; then
                echo "| $label | ✅ |"
              else
                echo "| $label | ❌ |"
              fi
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: 编译 libcurl
        id: libcurl
        continue-on-error: true
        run: |
          set -e
          cd /builder
          if make package/curl/compile -j$(nproc) V=s 2>&1 | tee /tmp/curl.log; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "--- libcurl 产物 ---"
            ls -la staging_dir/target-*/usr/lib/libcurl* 2>/dev/null || true
            ls -la staging_dir/target-*/usr/include/curl/ 2>/dev/null | head -5 || true
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "::error::libcurl 编译失败"
            tail -50 /tmp/curl.log
            exit 1
          fi

      - name: 编译 esurfingclient
        id: build
        run: |
          set -e
          cd /builder
          cp -r "$GITHUB_WORKSPACE/esurfingclient" package/
          scripts/feeds install esurfingclient
          echo "--- 开始编译 (curl_profile=${{ github.event.inputs.curl_profile }}) ---"
          if make package/esurfingclient/compile -j$(nproc) V=s 2>&1 | tee /tmp/build.log; then
            echo "✅ 并行编译成功"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "::warning::并行编译失败，降级 -j1 重试"
            if make package/esurfingclient/compile -j1 V=s 2>&1 | tee -a /tmp/build.log; then
              echo "status=success"
              echo "status=success" >> $GITHUB_OUTPUT
            else
              echo "status=failure" >> $GITHUB_OUTPUT
              if [ "${{ github.event.inputs.curl_profile }}" = "firmware" ]; then
                echo "::warning::固件同款配置下编译失败——这是预期的（静态链接缺 libnghttp2.a）"
                echo "--- 未定义符号统计 ---"
                grep -c "undefined reference to" /tmp/build.log || true
                echo "--- 按库分类 ---"
                grep -o "undefined reference to \`[a-zA-Z0-9_]*'" /tmp/build.log 2>/dev/null \
                  | sed "s/.*\`//; s/'//" \
                  | sed -E 's/^(nghttp2|SSL|OPENSSL|EVP|X509|BIO|ERR|OSSL|inflate|deflate|compress|ASN1|BN|CRYPTO|d2i|ENGINE|OCSP|PEM|PKCS|RAND|TLS|UI)_.*/\1/' \
                  | sort | uniq -c | sort -rn | head -15 || true
                echo "--- 关键错误行 ---"
                grep -E "attempted static link|undefined reference" /tmp/build.log | head -5 || true
              else
                echo "::error::编译失败"
                tail -60 /tmp/build.log
                exit 1
              fi
            fi
          fi

      - name: 收集产物
        id: collect
        run: |
          cd /builder
          echo "--- 查找所有产物 ---"
          find bin/packages -type f \( -name "esurfingclient*" -o -name "luci-app-esurfingclient*" \) 2>/dev/null | tee /tmp/found.txt || true
          COUNT=$(grep -c . /tmp/found.txt 2>/dev/null || echo 0)
          echo "找到 $COUNT 个文件"
          mkdir -p /tmp/out

          if [ "$COUNT" -eq 0 ]; then
            if [ "${{ steps.build.outputs.status }}" = "success" ]; then
              echo "::error::编译报告成功但未找到产物"
              echo "status=none" >> $GITHUB_OUTPUT
              exit 1
            fi
            echo "::warning::编译失败，无产物（符合预期）"
            echo "status=none" >> $GITHUB_OUTPUT
          else
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" /tmp/out/
            done < /tmp/found.txt
            echo "status=ok" >> $GITHUB_OUTPUT
          fi
          echo "--- 产物 ---"
          ls -la /tmp/out/ 2>/dev/null || echo "(空)"

      - name: 验证产物架构
        run: |
          set -e
          cd /builder
          echo "--- 二进制架构检查 ---"
          BIN=$(find build_dir/target-*/esurfingclient -name "ESurfingClient" -type f 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            echo "二进制: $BIN"
            file "$BIN" || true
            echo "--- 是否静态链接 ---"
            ldd "$BIN" 2>&1 | head -3 || true
            echo "--- 体积 ---"
            ls -lh "$BIN"
            echo "--- 动态符号（应无 curl/SSL 依赖）---"
            readelf -d "$BIN" 2>/dev/null | grep -E "NEEDED" || echo "  无 NEEDED（完全静态）"
          else
            echo "::warning::未找到二进制文件"
          fi
          echo ""
          echo "--- 包内容 ---"
          for pkg in /tmp/out/*; do
            [ -f "$pkg" ] || continue
            echo "=== $(basename "$pkg") ==="
            case "$pkg" in
              *.apk|*.ipk) tar -tzf "$pkg" 2>/dev/null | head -12 || echo "  (无法列出)" ;;
            esac
          done

      - name: 上传产物
        if: steps.collect.outputs.status == 'ok'
        uses: actions/upload-artifact@v7
        with:
          name: verify-esurfingclient-${{ github.event.inputs.architecture }}-${{ github.event.inputs.sdk_version }}-${{ github.event.inputs.curl_profile }}-run${{ github.run_number }}
          path: /tmp/out/*
          retention-days: 14
          if-no-files-found: error

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-build-log-${{ github.event.inputs.curl_profile }}-run${{ github.run_number }}
          path: |
            /tmp/build.log
            /tmp/curl.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 结果摘要
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          PROFILE="${{ github.event.inputs.curl_profile }}"

          if [ "$BUILD_STATUS" = "success" ]; then
            VERDICT="✅ 编译成功"
          elif [ "$PROFILE" = "firmware" ]; then
            VERDICT="⚠️ 编译失败（固件同款配置下的预期结果）"
          else
            VERDICT="❌ 编译失败"
          fi

          {
            echo "## 编译验证结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| SDK | \`${{ github.event.inputs.target }}-${{ github.event.inputs.sdk_version }}\` |"
            echo "| 架构 | \`${{ github.event.inputs.architecture }}\` |"
            echo "| curl 配置 | \`$PROFILE\` |"
            echo "| 结果 | $VERDICT |"
            echo "| 产物数 | $(ls /tmp/out/ 2>/dev/null | wc -l) |"
            echo ""
            if [ "$PROFILE" = "firmware" ]; then
              echo "> **固件同款配置**：libcurl 启用 HTTP2 + OpenSSL + ZLIB。"
              echo "> 此模式下若编译失败，属于已知问题——静态链接需要 \`libnghttp2.a\`，"
              echo "> 但 OpenWrt 的 nghttp2 包只构建动态库。"
              echo ""
            fi
            echo "### 产物清单"
            echo '```'
            ls -la /tmp/out/ 2>/dev/null || echo "(无产物)"
            echo '```'
            echo ""
            if [ -f /tmp/build.log ]; then
              echo "### 未定义符号统计（如有）"
              echo '```'
              grep -o "undefined reference to \`[a-zA-Z0-9_]*'" /tmp/build.log 2>/dev/null \
                | sed "s/.*\`//; s/'//" \
                | sed -E 's/^(nghttp2|SSL|OPENSSL|EVP|X509|BIO|ERR|OSSL|inflate|deflate|compress|ASN1|BN|CRYPTO|d2i|ENGINE|OCSP|PEM|PKCS|RAND|TLS|UI)_.*/\1/' \
                | sort | uniq -c | sort -rn | head -15 || echo "(无未定义符号)"
              echo '```'
              echo ""
              echo "### 编译日志末尾"
              echo '```'
              tail -30 /tmp/build.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: 最终判定
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          PROFILE="${{ github.event.inputs.curl_profile }}"

          if [ "$BUILD_STATUS" = "success" ]; then
            echo "✅ 编译成功（curl_profile=$PROFILE）"
            exit 0
          fi

          if [ "$PROFILE" = "firmware" ]; then
            echo "⚠️ 固件同款配置下编译失败——这正是预期结果"
            echo "   原因：静态链接需要 libnghttp2.a，OpenWrt 的 nghttp2 包只构建 .so"
            echo "   该模式的用途是复现整机构建的失败，验证诊断结论"
            exit 0
          fi

          echo "❌ 精简配置下编译失败，这是真实问题"
          exit 1
